    color: #fff;
    padding: 16px 20px;
    min-height: 185px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header h1 { font-size: 1.3rem; font-weight: 600; text-shadow: 0 1px 4px rgba(0,0,0,0.6); }
  header .logo {
    height: 44px;
    width: 44px;
    border-radius: 50%;
    background: #fff;
    object-fit: cover;
    border: 2px solid rgba(255,255,255,0.7);
  }

  nav {
    display: flex;
    background: #fff;
    border-bottom: 2px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  nav button {
    flex: 1;
    padding: 12px 4px;
    border: none;
    background: none;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 3px solid transparent;
  }
  nav button.active { color: var(--green-dark); border-bottom-color: var(--green); }
  nav button:disabled { opacity: 0.35; cursor: default; }

  main { max-width: 860px; margin: 0 auto; padding: 16px; }
  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
  }
  .card h2 { font-size: 1.05rem; color: var(--green-dark); margin-bottom: 12px; }
  label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  input[type="text"], input[type="date"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 1rem;
  }
  input[type="text"]:focus, input[type="date"]:focus { outline: 2px solid var(--green); border-color: transparent; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    background: var(--green);
    color: #fff;
  }
  .btn:hover { background: var(--green-dark); }
  .btn.secondary { background: #fff; color: var(--green-dark); border: 1px solid var(--green); }
  .btn.secondary:hover { background: var(--green-light); }
  .btn.danger { background: #fff; color: var(--double); border: 1px solid var(--double); }
  .btn.danger:hover { background: #fdecea; }
  .btn.small { padding: 6px 12px; font-size: 0.85rem; }
  .btn:disabled { opacity: 0.4; cursor: default; }

  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .row > .grow { flex: 1; min-width: 160px; }

  .seg { display: inline-flex; border: 1px solid var(--green); border-radius: 8px; overflow: hidden; }
  .seg button {
    padding: 8px 18px;
    border: none;
    background: #fff;
    color: var(--green-dark);
    font-weight: 600;
    cursor: pointer;
  }
  .seg button.active { background: var(--green); color: #fff; }

  .player-list { display: flex; flex-direction: column; gap: 8px; }
  .player-row { display: flex; gap: 8px; }
  .player-row input { flex: 1; }
  .player-row .remove {
    background: none;
    border: none;
    color: var(--double);
    font-size: 1.2rem;
    cursor: pointer;
    padding: 0 8px;
  }

  .par-grid {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    gap: 6px;
  }
  .par-cell { text-align: center; }
  .par-cell .hole-num { font-size: 0.7rem; color: var(--muted); margin-bottom: 2px; }
  .par-cell button {
    width: 100%;
    padding: 8px 0;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  .par-cell button:hover { background: var(--green-light); }

  /* Scorecard table */
  .table-wrap { overflow-x: auto; }
  table.scorecard { border-collapse: collapse; width: 100%; min-width: 420px; }
  table.scorecard th, table.scorecard td {
    border: 1px solid var(--border);
    padding: 6px 8px;
    text-align: center;
    font-size: 0.9rem;
  }
  table.scorecard th { background: var(--green-light); color: var(--green-dark); }
  table.scorecard td.hole-col { background: var(--green-light); font-weight: 700; color: var(--green-dark); }
  table.scorecard td.par-col { color: var(--muted); }
  table.scorecard tr.section-row td {
    background: #eef4ee;
    font-weight: 700;
    font-size: 0.85rem;
  }
  table.scorecard tr.total-row td { background: var(--green-light); font-weight: 700; }
  table.scorecard td.win-cell { background: #def0de; }
  .score-btn {
    width: 40px;
    height: 34px;
    border: 1px dashed #b8ccb8;
    border-radius: 6px;
    background: #fff;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    color: var(--text);
  }
  .score-btn.empty { color: #b0bdb0; }
  .score-btn.s-eagle  { border: 2px double var(--eagle);  color: var(--eagle);  border-radius: 50%; }
  .score-btn.s-birdie { border: 2px solid var(--birdie);  color: var(--birdie); border-radius: 50%; }
  .score-btn.s-par    { border: 1px solid var(--border);  color: var(--par-c); }
  .score-btn.s-bogey  { border: 2px solid var(--bogey);   color: var(--bogey);  border-radius: 4px; }
  .score-btn.s-double { border: 2px double var(--double);  color: var(--double); border-radius: 4px; }
  .vs-par { font-size: 0.8rem; color: var(--muted); }

  /* Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 100;
  }
  .modal {
    background: #fff;
    border-radius: 16px 16px 0 0;
    padding: 20px;
    width: 100%;
    max-width: 420px;
  }
  .modal h3 { font-size: 1rem; margin-bottom: 4px; color: var(--green-dark); }
  .modal .sub { font-size: 0.85rem; color: var(--muted); margin-bottom: 14px; }
  .numpad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .numpad button {
    padding: 14px 0;
    font-size: 1.1rem;
    font-weight: 700;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    cursor: pointer;
  }
  .numpad button:hover { background: var(--green-light); }
  .numpad button.is-par { background: var(--green-light); border-color: var(--green); }
  .numpad button.clear { color: var(--double); font-size: 0.9rem; }

  /* History */
  .round-item { border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; }
  .round-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 14px;
    cursor: pointer;
    background: #fff;
  }
  .round-head:hover { background: var(--green-light); }
  .round-head .title { font-weight: 700; }
  .round-head .meta { font-size: 0.82rem; color: var(--muted); }
  .round-body { padding: 0 14px 14px; }

  /* Statistics */
  .stat-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .stat-box {
    background: var(--green-light);
    border-radius: var(--radius);
    padding: 12px;
    text-align: center;
  }
  .stat-box .val { font-size: 1.4rem; font-weight: 700; color: var(--green-dark); }
  .stat-box .lbl { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
  .dist-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 0.85rem; }
  .dist-row .name { width: 110px; flex-shrink: 0; }
  .dist-row .bar-track { flex: 1; background: #eef2ee; border-radius: 4px; height: 18px; position: relative; }
  .dist-row .bar { height: 100%; border-radius: 4px; }
  .dist-row .count { width: 70px; text-align: right; color: var(--muted); }
  .hole-bars { display: grid; grid-template-columns: repeat(auto-fit, minmax(28px, 1fr)); gap: 4px; align-items: end; height: 130px; margin-top: 8px; }
  .hole-bar { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; font-size: 0.65rem; color: var(--muted); }
  .hole-bar .bar { width: 100%; max-width: 26px; border-radius: 3px 3px 0 0; background: var(--green); position: relative; }
  .hole-bar .bar.over { background: var(--bogey); }
  .hole-bar .bar.under { background: var(--birdie); }
  .hole-bar .v { font-size: 0.62rem; color: var(--text); margin-bottom: 2px; }
  .empty-note { color: var(--muted); text-align: center; padding: 30px 10px; font-size: 0.95rem; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 0.78rem; color: var(--muted); margin-top: 10px; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  select {
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.95rem;
    background: #fff;
  }
  @media (max-width: 600px) {
    .par-grid { grid-template-columns: repeat(9, minmax(30px, 1fr)); gap: 4px; }
    main { padding: 10px; }
    /* Scorecard so kompakt, dass 4 Teilnehmer ohne Seitwärts-Scrollen passen */
    .card { padding: 14px 10px; }
    table.scorecard { min-width: 0; }
    table.scorecard th, table.scorecard td { padding: 5px 1px; font-size: 0.85rem; }
    table.scorecard th { font-size: 0.8rem; }
    table.scorecard tr.section-row td { font-size: 0.68rem; line-height: 1.3; }
    table.scorecard .par-sub { display: block; font-weight: 400; }
    /* schmale Loch-/Par-Spalten, damit die Tippflächen groß bleiben */
    table.scorecard th:first-child, table.scorecard td.hole-col { width: 34px; }
    table.scorecard th:nth-child(2), table.scorecard td.par-col { width: 30px; }
    .score-btn { width: 100%; min-width: 34px; max-width: 56px; height: 38px; }
  }
</style>
</head>

/* Gleicht bereits gespeicherte Runden an die aktuelle Par-Verteilung an
   (Loch 18: Par 3 → Par 4). Nur Runden mit exakt der alten Anger-Verteilung
   werden angefasst, Scores bleiben unverändert. */
function migratePars() {
  const istAlt = r => r && Array.isArray(r.pars) &&
    r.pars.length === FUGO_PARS_ALT.length &&
    r.pars.every((p, i) => p === FUGO_PARS_ALT[i]);
  let changed = false;
  for (const r of state.rounds) {
    if (istAlt(r)) { r.pars = FUGO_PARS.slice(); changed = true; }
  }
  if (istAlt(state.currentRound)) { state.currentRound.pars = FUGO_PARS.slice(); changed = true; }
  if (changed) saveState();
}

function mergeSeedRounds() {
  let changed = false;
  for (const seed of SEED_ROUNDS) {
    const existing = state.rounds.find(r => r.id === seed.id);
    if (!existing) {
      state.rounds.push(JSON.parse(JSON.stringify(seed)));
      changed = true;
    } else if (existing.courseName !== seed.courseName) {
      // Platzname bereits gespeicherter Import-Runden aktuell halten
      existing.courseName = seed.courseName;
      changed = true;
    }
  }
  if (changed) saveState();
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (s && Array.isArray(s.rounds)) return s;
    }
  } catch (e) { /* korrupte Daten -> Neustart */ }
  return { currentRound: null, rounds: [] };
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

/* ---------- Export / Import ---------- */

/* Deterministische Kennung aus dem Inhalt, damit dieselbe Runde
   auf verschiedenen Geräten dieselbe id bekommt (Duplikat-Erkennung). */
function roundFingerprint(r) {
  const s = r.date + "|" + r.players.map(p => p.name + ":" + p.scores.join(",")).join(";");
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
  return "r-" + h.toString(16);
}

function ensureRoundIds() {
  let changed = false;
  for (const r of state.rounds) {
    if (!r.id) { r.id = roundFingerprint(r); changed = true; }
  }
  if (changed) saveState();
}

function exportPayload() {
  return { app: "fugo-scorecard", exportiert: new Date().toISOString(), rounds: state.rounds };
}

function exportRounds() {
  const blob = new Blob([JSON.stringify(exportPayload(), null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "fugo-scorecard-" + todayISO() + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function validRound(r) {
  return r && typeof r.date === "string" && !isNaN(new Date(r.date)) &&
    Array.isArray(r.pars) && r.pars.length > 0 && r.pars.every(p => Number.isFinite(p)) &&
    Array.isArray(r.players) && r.players.length > 0 &&
    r.players.every(p => p && typeof p.name === "string" && p.name.trim() &&
      Array.isArray(p.scores) && p.scores.length === r.pars.length &&
      p.scores.every(s => Number.isFinite(s)));
}

function importRoundsFromText(text) {
  let data;
  try { data = JSON.parse(text); } catch (e) { return { error: "Datei ist kein gültiges JSON." }; }
  const list = Array.isArray(data) ? data : (data && Array.isArray(data.rounds) ? data.rounds : null);
  if (!list) return { error: "Kein Runden-Export erkannt." };
  let added = 0, skipped = 0, invalid = 0;
  for (const r of list) {
    if (!validRound(r)) { invalid++; continue; }
    const id = (typeof r.id === "string" && r.id) ? r.id : roundFingerprint(r);
    if (state.rounds.some(x => x.id === id)) { skipped++; continue; }
    state.rounds.push({
      id,
      courseName: String(r.courseName || "Denninger Anger"),
      date: r.date,
      pars: r.pars.slice(),
      players: r.players.map(p => ({ name: p.name, scores: p.scores.slice() }))
    });
    added++;
  }
  if (added) saveState();
  return { added, skipped, invalid };
}

function importRounds(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    input.value = "";
    const res = importRoundsFromText(reader.result);
    if (res.error) { alert(res.error); return; }
    render();
    alert("Import abgeschlossen:\n" +
      res.added + " Runde(n) übernommen\n" +
      res.skipped + " bereits vorhanden" +
      (res.invalid ? "\n" + res.invalid + " ungültig übersprungen" : ""));
  };
  reader.readAsText(file);
}

/* ---------- Setup-Formular (flüchtiger Zustand) ---------- */

let setup = {
  courseName: "Denninger Anger",
  date: todayISO(),
  holeCount: 18,
  pars: defaultPars(18),
  players: FUGO_PLAYERS.slice()
};

function todayISO() {
  const d = new Date();
  return d.getFullYear() + "-" +
    String(d.getMonth() + 1).padStart(2, "0") + "-" +
    String(d.getDate()).padStart(2, "0");
}

function defaultPars(n) {
  return FUGO_PARS.slice(0, n);
}

/* ---------- Navigation ---------- */

let activeView = state.currentRound ? "play" : "setup";

function showView(name) {
  activeView = name;
  render();
}

/* ---------- Rendering ---------- */

function render() {
  for (const v of ["setup", "play", "history", "stats"]) {
    document.getElementById("view-" + v).hidden = (v !== activeView);
    const btn = document.getElementById("nav-" + v);
    btn.classList.toggle("active", v === activeView);
  }
  document.getElementById("nav-play").disabled = !state.currentRound;

  if (activeView === "setup") renderSetup();
  if (activeView === "play") renderPlay();
  if (activeView === "history") renderHistory();
  if (activeView === "stats") renderStats();
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* ---------- Ansicht: Neue Runde ---------- */

function renderSetup() {

  const playersHtml = setup.players.map((p, i) => `
    <div class="player-row">
      <input type="text" placeholder="Spieler ${i + 1}" value="${esc(p)}"
             oninput="setup.players[${i}] = this.value">
      ${setup.players.length > 1
        ? `<button class="remove" title="Spieler entfernen" onclick="removePlayer(${i})">✕</button>`

          <input type="date" value="${esc(setup.date)}" onchange="setup.date = this.value">

      </div>

        <label>Anzahl Löcher</label>

          <button class="${setup.holeCount === 9 ? "active" : ""}" onclick="setHoleCount(9)">9 Löcher</button>
          <button class="${setup.holeCount === 18 ? "active" : ""}" onclick="setHoleCount(18)">18 Löcher</button>
        </div>

        <label>Par pro Loch <span style="font-weight:400">(klicken zum Ändern)</span> — Gesamt-Par: ${setup.pars.reduce((a, b) => a + b, 0)}</label>
        <div class="par-grid">${parsHtml}</div>

function setHoleCount(n) {
  if (n === setup.holeCount) return;
  setup.holeCount = n;
  const old = setup.pars;
  setup.pars = defaultPars(n);
  for (let i = 0; i < Math.min(old.length, n); i++) setup.pars[i] = old[i];
  render();
}

function cyclePar(i) {
  const next = setup.pars[i] + 1;
  setup.pars[i] = next > 6 ? 2 : next;
  render();
}

function addPlayer() {
  if (setup.players.length >= 8) return;
  setup.players.push("");
  render();
}

function removePlayer(i) {
  setup.players.splice(i, 1);
  render();
}

function startRound() {
  const names = setup.players.map(p => p.trim()).filter(p => p);
  if (names.length === 0) {
    alert("Bitte mindestens einen Spielernamen eingeben.");
    return;
  }
  const unique = new Set(names.map(n => n.toLowerCase()));
  if (unique.size !== names.length) {
    alert("Spielernamen müssen eindeutig sein.");
    return;
  }
  if (state.currentRound && !confirm("Es läuft bereits eine Runde. Wirklich verwerfen und neu starten?")) {
    return;
  }
  state.currentRound = {
    courseName: setup.courseName.trim() || "Denninger Anger",
    date: (setup.date || todayISO()) + "T12:00:00",
    pars: setup.pars.slice(),
    players: names.map(n => ({ name: n, scores: setup.pars.map(() => null) }))
  };
  saveState();
  showView("play");
}

/* ---------- Ansicht: Scorecard ---------- */

function scoreClass(score, par) {
  if (score == null) return "empty";
  const d = score - par;
  if (d <= -2) return "s-eagle";
  if (d === -1) return "s-birdie";
  if (d === 0) return "s-par";
  if (d === 1) return "s-bogey";
  return "s-double";
}

function sumScores(scores, from, to) {
  let total = 0, any = false;
  for (let i = from; i < to; i++) {
    if (scores[i] != null) { total += scores[i]; any = true; }
  }
  return any ? total : null;
}

function vsParText(scores, pars) {
  let diff = 0, played = 0;
  for (let i = 0; i < scores.length; i++) {
    if (scores[i] != null) { diff += scores[i] - pars[i]; played++; }
  }
  if (played === 0) return "";
  if (diff === 0) return "E";
  return diff > 0 ? "+" + diff : String(diff);
}

/* Lochsieger je Loch: Index des Spielers mit alleiniger niedrigster Schlagzahl, sonst -1 */
function holeWinners(round) {
  return round.pars.map((_, i) => {
    let best = Infinity, idx = -1, tie = false;
    round.players.forEach((p, pi) => {
      const s = p.scores[i];
      if (s == null) return;
      if (s < best) { best = s; idx = pi; tie = false; }
      else if (s === best) tie = true;
    });
    return (idx !== -1 && !tie) ? idx : -1;
  });
}

function holeWinCounts(round) {
  const wins = round.players.map(() => 0);
  if (round.players.length < 2) return wins;
  for (const w of holeWinners(round)) if (w !== -1) wins[w]++;
  return wins;
}

function renderPlay() {
  const el = document.getElementById("view-play");
  const r = state.currentRound;
  if (!r) {
    el.innerHTML = `<div class="empty-note">Keine laufende Runde.<br><br>
      <button class="btn" onclick="showView('setup')">Neue Runde anlegen</button></div>`;
    return;
  }
  const n = r.pars.length;
  const half = n === 18 ? 9 : n;
  const d = new Date(r.date);

  let rows = "";
  const holeRow = (i) => {
    let cells = `<td class="hole-col">${i + 1}</td><td class="par-col">${r.pars[i]}</td>`;
    r.players.forEach((p, pi) => {
      const s = p.scores[i];
      cells += `<td><button class="score-btn ${scoreClass(s, r.pars[i])}"
        onclick="openScorePad(${pi}, ${i})">${s == null ? "·" : s}</button></td>`;
    });
    return `<tr>${cells}</tr>`;
  };
  const sumRow = (label, from, to) => {
    let cells = `<td colspan="2">${label} <span class="par-sub">(Par ${r.pars.slice(from, to).reduce((a, b) => a + b, 0)})</span></td>`;
    r.players.forEach(p => {
      const s = sumScores(p.scores, from, to);
      cells += `<td>${s == null ? "–" : s}</td>`;
    });
    return `<tr class="section-row">${cells}</tr>`;
  };

  for (let i = 0; i < Math.min(half, n); i++) rows += holeRow(i);
  if (n === 18) {
    rows += sumRow("Front 9", 0, 9);
    for (let i = 9; i < 18; i++) rows += holeRow(i);
    rows += sumRow("Back 9", 9, 18);
  }

  let totalCells = `<td colspan="2">Gesamt <span class="par-sub">(Par ${r.pars.reduce((a, b) => a + b, 0)})</span></td>`;
  r.players.forEach(p => {
    const s = sumScores(p.scores, 0, n);
    const vp = vsParText(p.scores, r.pars);
    totalCells += `<td>${s == null ? "–" : s} ${vp ? `<span class="vs-par">(${vp})</span>` : ""}</td>`;
  });
  rows += `<tr class="total-row">${totalCells}</tr>`;

  const headCells = r.players.map(p => `<th>${esc(p.name)}</th>`).join("");
  const complete = r.players.every(p => p.scores.every(s => s != null));

  el.innerHTML = `
    <div class="card">
      <h2>⛳ Runde vom ${d.toLocaleDateString("de-DE")}</h2>
      <p style="font-size:0.85rem;color:var(--muted);margin-bottom:12px">
        ${d.toLocaleDateString("de-DE", { weekday: "long" })} · ${esc(r.courseName)} · ${n} Löcher</p>
      <div class="table-wrap">
        <table class="scorecard">
          <thead><tr><th>Loch</th><th>Par</th>${headCells}</tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div class="legend">
        <span><span class="dot" style="background:var(--eagle)"></span>Eagle oder besser</span>
        <span><span class="dot" style="background:var(--birdie)"></span>Birdie</span>
        <span><span class="dot" style="background:var(--par-c)"></span>Par</span>
        <span><span class="dot" style="background:var(--bogey)"></span>Bogey</span>
        <span><span class="dot" style="background:var(--double)"></span>Doppelbogey+</span>
      </div>
    </div>
    <div class="row">
      <button class="btn grow" onclick="finishRound()" ${complete ? "" : "disabled"}>✔ Runde beenden &amp; speichern</button>
      <button class="btn danger" onclick="discardRound()">Runde verwerfen</button>
    </div>
    ${complete ? "" : `<p style="text-align:center;margin-top:8px;font-size:0.85rem;color:var(--muted)">
      Zum Speichern müssen alle Löcher eingetragen sein.</p>`}
  `;
}

function openScorePad(playerIdx, holeIdx) {
  const r = state.currentRound;
  const p = r.players[playerIdx];
  const par = r.pars[holeIdx];
  const buttons = [];
  for (let v = 1; v <= 11; v++) {
    buttons.push(`<button class="${v === par ? "is-par" : ""}" onclick="setScore(${playerIdx}, ${holeIdx}, ${v})">${v}</button>`);
  }
  buttons.push(`<button class="clear" onclick="setScore(${playerIdx}, ${holeIdx}, null)">Löschen</button>`);

  document.getElementById("modal-root").innerHTML = `
    <div class="modal-backdrop" onclick="if (event.target === this) closeModal()">
      <div class="modal">
        <h3>${esc(p.name)} – Loch ${holeIdx + 1}</h3>
        <p class="sub">Par ${par} · Schlagzahl wählen</p>
        <div class="numpad">${buttons.join("")}</div>
      </div>
    </div>`;
}

function closeModal() {
  document.getElementById("modal-root").innerHTML = "";
}

function setScore(playerIdx, holeIdx, value) {
  state.currentRound.players[playerIdx].scores[holeIdx] = value;
  saveState();
  closeModal();
  // automatisch zum nächsten Spieler am selben Loch springen
  if (value != null) {
    const r = state.currentRound;
    const next = r.players.findIndex((p, i) => i > playerIdx && p.scores[holeIdx] == null);
    render();
    if (next !== -1) openScorePad(next, holeIdx);
    return;
  }
  render();
}

function finishRound() {
  const r = state.currentRound;
  if (!r.players.every(p => p.scores.every(s => s != null))) return;
  r.id = roundFingerprint(r);
  state.rounds.push(r);
  state.currentRound = null;
  saveState();
  showView("history");
}

function discardRound() {
  if (!confirm("Laufende Runde wirklich verwerfen? Alle Eingaben gehen verloren.")) return;
  state.currentRound = null;
  saveState();
  showView("setup");
}

/* ---------- Ansicht: Verlauf ---------- */

let expandedRound = null;

function renderHistory() {
  const el = document.getElementById("view-history");
  const toolbar = `
    <div class="row" style="margin-bottom:12px">
      <button class="btn secondary small" onclick="exportRounds()" ${state.rounds.length ? "" : "disabled"}>⬇ Exportieren</button>
      <button class="btn secondary small" onclick="document.getElementById('import-file').click()">⬆ Importieren</button>
      <input type="file" id="import-file" accept=".json,application/json" hidden onchange="importRounds(this)">
    </div>`;
  if (state.rounds.length === 0) {
    el.innerHTML = `<div class="card">${toolbar}
      <div class="empty-note">Noch keine gespeicherten Runden.<br>
      Beende eine Runde, um sie hier zu sehen.</div></div>`;
    return;
  }
  const items = state.rounds
    .map((r, idx) => ({ r, idx }))
    .sort((a, b) => new Date(b.r.date) - new Date(a.r.date))
    .map(({ r, idx }) => {
      const d = new Date(r.date);
      const parTotal = r.pars.reduce((a, b) => a + b, 0);
      const best = r.players.reduce((acc, p) => {
        const t = p.scores.reduce((a, b) => a + b, 0);
        return (acc === null || t < acc.t) ? { name: p.name, t } : acc;
      }, null);
      const summary = r.players.map(p => {
        const t = p.scores.reduce((a, b) => a + b, 0);
        const diff = t - parTotal;
        const ds = diff === 0 ? "E" : (diff > 0 ? "+" + diff : diff);
        return `${esc(p.name)}: ${t} (${ds})`;
      }).join(" · ");
      const wins = holeWinCounts(r);
      const winSummary = r.players.map((p, pi) => `${esc(p.name)} ${wins[pi]}`).join(" · ");

      let detail = "";
      if (expandedRound === idx) {
        const winners = holeWinners(r);
        let rows = "";
        for (let i = 0; i < r.pars.length; i++) {
          let cells = `<td class="hole-col">${i + 1}</td><td class="par-col">${r.pars[i]}</td>`;
          r.players.forEach((p, pi) => {
            const won = r.players.length >= 2 && winners[i] === pi;
            cells += `<td class="${won ? "win-cell" : ""}"><span class="score-btn ${scoreClass(p.scores[i], r.pars[i])}"
              style="display:inline-flex;align-items:center;justify-content:center;cursor:default">${p.scores[i]}</span></td>`;
          });
          rows += `<tr>${cells}</tr>`;
        }
        let winRow = `<td colspan="2">Lochsiege</td>`;
        r.players.forEach((p, pi) => { winRow += `<td>${wins[pi]}</td>`; });
        rows += `<tr class="section-row">${winRow}</tr>`;
        let totals = `<td colspan="2">Gesamt</td>`;
        r.players.forEach(p => { totals += `<td>${p.scores.reduce((a, b) => a + b, 0)}</td>`; });
        detail = `
          <div class="round-body">
            <div class="table-wrap">
              <table class="scorecard">
                <thead><tr><th>Loch</th><th>Par</th>${r.players.map(p => `<th>${esc(p.name)}</th>`).join("")}</tr></thead>
                <tbody>${rows}<tr class="total-row">${totals}</tr></tbody>
              </table>
            </div>
            <div style="margin-top:10px;text-align:right">
              <button class="btn danger small" onclick="deleteRound(${idx}); event.stopPropagation()">Runde löschen</button>
            </div>
          </div>`;
      }

      return `
        <div class="round-item">
          <div class="round-head" onclick="toggleRound(${idx})">
            <div>
              <div class="title">Runde vom ${d.toLocaleDateString("de-DE")}</div>
              <div class="meta">${esc(r.courseName)} · ${r.pars.length} Löcher · ${summary}</div>
              <div class="meta">Lochsiege: ${winSummary}</div>
            </div>
            <div class="meta">🏆 ${esc(best.name)} &nbsp; ${expandedRound === idx ? "▲" : "▼"}</div>
          </div>
          ${detail}
        </div>`;
    }).join("");

  el.innerHTML = `<div class="card"><h2>📋 Gespielte Runden (${state.rounds.length})</h2>${toolbar}${items}</div>`;
}

function toggleRound(idx) {
  expandedRound = (expandedRound === idx) ? null : idx;
  render();
}

function deleteRound(idx) {
  if (!confirm("Diese Runde endgültig löschen?")) return;
  state.rounds.splice(idx, 1);
  expandedRound = null;
  saveState();
  render();
}

/* ---------- Ansicht: Statistiken ---------- */

let statsPlayer = "__all__";

function allPlayerNames() {
  const names = [];
  for (const r of state.rounds) {
    for (const p of r.players) {
      if (!names.includes(p.name)) names.push(p.name);
    }
  }
  return names;
}

function playerStats(name) {
  const rounds = [];
  for (const r of state.rounds) {
    const pi = r.players.findIndex(p => p.name === name);
    if (pi !== -1) rounds.push({ round: r, scores: r.players[pi].scores, playerIdx: pi });
  }
  if (rounds.length === 0) return null;

  let dist = { eagle: 0, birdie: 0, par: 0, bogey: 0, double: 0 };
  let totalStrokes = 0, totalPar = 0, totalHoles = 0;
  let bestVsPar = null, bestRound = null;
  const byParType = { 3: { s: 0, n: 0 }, 4: { s: 0, n: 0 }, 5: { s: 0, n: 0 } };
  // Lochdurchschnitt nur über 18-Loch-Runden mit identischer Lochzahl sinnvoll;
  // wir mitteln die Differenz zu Par je Lochnummer über alle Runden.
  const holeDiff = {};

  let lochsiege = 0;
  for (const { round, scores, playerIdx } of rounds) {
    lochsiege += holeWinCounts(round)[playerIdx];
    let roundTotal = 0, roundPar = 0;
    scores.forEach((s, i) => {
      const par = round.pars[i];
      const d = s - par;
      roundTotal += s; roundPar += par;
      totalStrokes += s; totalPar += par; totalHoles++;
      if (d <= -2) dist.eagle++;
      else if (d === -1) dist.birdie++;
      else if (d === 0) dist.par++;
      else if (d === 1) dist.bogey++;
      else dist.double++;
      if (byParType[par]) { byParType[par].s += s; byParType[par].n++; }
      if (!holeDiff[i]) holeDiff[i] = { sum: 0, n: 0 };
      holeDiff[i].sum += d; holeDiff[i].n++;
    });
    const vs = roundTotal - roundPar;
    if (bestVsPar === null || vs < bestVsPar) {
      bestVsPar = vs;
      bestRound = { total: roundTotal, vs, course: round.courseName, date: round.date, holes: scores.length };
    }
  }

  return {
    name,
    roundCount: rounds.length,
    avgPerHole: totalStrokes / totalHoles,
    avgVsParPerHole: (totalStrokes - totalPar) / totalHoles,
    dist, bestRound, byParType, holeDiff, totalHoles, lochsiege
  };
}

function fmtVs(v) {
  if (Math.abs(v) < 0.005) return "E";
  const s = v.toFixed(2).replace(".", ",");
  return v > 0 ? "+" + s : s;
}

function renderStats() {
  const el = document.getElementById("view-stats");
  const names = allPlayerNames();
  if (names.length === 0) {
    el.innerHTML = `<div class="empty-note">Noch keine Daten für Statistiken.<br>
      Spiele und speichere zuerst eine Runde.</div>`;
    return;
  }
  if (statsPlayer !== "__all__" && !names.includes(statsPlayer)) statsPlayer = "__all__";

  const selector = `
    <div class="row" style="margin-bottom:14px">
      <label style="margin:0">Spieler:</label>
      <select onchange="statsPlayer = this.value; render()">
        <option value="__all__" ${statsPlayer === "__all__" ? "selected" : ""}>Alle (Vergleich)</option>
        ${names.map(n => `<option value="${esc(n)}" ${statsPlayer === n ? "selected" : ""}>${esc(n)}</option>`).join("")}
      </select>
    </div>`;

  if (statsPlayer === "__all__") {
    const stats = names.map(playerStats).filter(Boolean)
      .sort((a, b) => a.avgVsParPerHole - b.avgVsParPerHole);
    const rows = stats.map((s, rank) => `
      <tr>
        <td>${rank + 1}.</td>
        <td style="text-align:left;font-weight:600">${esc(s.name)}</td>
        <td>${s.roundCount}</td>
        <td>${s.avgPerHole.toFixed(2).replace(".", ",")}</td>
        <td>${fmtVs(s.avgVsParPerHole)}</td>
        <td>${s.bestRound.total} (${s.bestRound.vs === 0 ? "E" : (s.bestRound.vs > 0 ? "+" : "") + s.bestRound.vs})</td>
        <td>${s.dist.birdie + s.dist.eagle}</td>
        <td>${s.lochsiege}</td>
      </tr>`).join("");

    const distHtml = stats.map(s => {
      const total = Object.values(s.dist).reduce((a, b) => a + b, 0);
      const segs = [
        ["eagle", "var(--eagle)"], ["birdie", "var(--birdie)"], ["par", "var(--par-c)"],
        ["bogey", "var(--bogey)"], ["double", "var(--double)"]
      ].map(([k, color]) => {
        const w = total ? (s.dist[k] / total * 100) : 0;
        return w > 0 ? `<div class="bar" style="width:${w}%;background:${color};display:inline-block"></div>` : "";
      }).join("");
      return `<div class="dist-row">
        <span class="name">${esc(s.name)}</span>
        <div class="bar-track" style="font-size:0;white-space:nowrap;overflow:hidden">${segs}</div>
        <span class="count">${total} Löcher</span>
      </div>`;
    }).join("");

    el.innerHTML = `
      <div class="card">
        <h2>📊 Spielervergleich</h2>
        ${selector}
        <div class="table-wrap">
          <table class="scorecard">
            <thead><tr><th></th><th style="text-align:left">Spieler</th><th>Runden</th>
              <th>Ø Schläge/Loch</th><th>Ø vs. Par/Loch</th><th>Beste Runde</th><th>Birdies+</th><th>Lochsiege</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>
      <div class="card">
        <h2>Score-Verteilung</h2>
        ${distHtml}
        <div class="legend">
          <span><span class="dot" style="background:var(--eagle)"></span>Eagle+</span>
          <span><span class="dot" style="background:var(--birdie)"></span>Birdie</span>
          <span><span class="dot" style="background:var(--par-c)"></span>Par</span>
          <span><span class="dot" style="background:var(--bogey)"></span>Bogey</span>
          <span><span class="dot" style="background:var(--double)"></span>Doppelbogey+</span>
        </div>
      </div>`;
    return;
  }

  /* Einzelspieler */
  const s = playerStats(statsPlayer);
  const total = Object.values(s.dist).reduce((a, b) => a + b, 0);
  const distRows = [
    ["Eagle oder besser", "eagle", "var(--eagle)"],
    ["Birdie", "birdie", "var(--birdie)"],
    ["Par", "par", "var(--par-c)"],
    ["Bogey", "bogey", "var(--bogey)"],
    ["Doppelbogey+", "double", "var(--double)"]
  ].map(([label, key, color]) => {
    const cnt = s.dist[key];
    const pct = total ? (cnt / total * 100) : 0;
    return `<div class="dist-row">
      <span class="name">${label}</span>
      <div class="bar-track"><div class="bar" style="width:${pct}%;background:${color}"></div></div>
      <span class="count">${cnt} (${pct.toFixed(0)}%)</span>
    </div>`;
  }).join("");

  const parTypeHtml = [3, 4, 5].map(pt => {
    const b = s.byParType[pt];
    return `<div class="stat-box">
      <div class="val">${b.n ? (b.s / b.n).toFixed(2).replace(".", ",") : "–"}</div>
      <div class="lbl">Ø auf Par ${pt} (${b.n} Löcher)</div>
    </div>`;
  }).join("");

  const holeNums = Object.keys(s.holeDiff).map(Number).sort((a, b) => a - b);
  const maxAbs = Math.max(0.5, ...holeNums.map(i => Math.abs(s.holeDiff[i].sum / s.holeDiff[i].n)));
  const holeBarsHtml = holeNums.map(i => {
    const avg = s.holeDiff[i].sum / s.holeDiff[i].n;
    const h = Math.max(4, Math.abs(avg) / maxAbs * 90);
    const cls = avg > 0.05 ? "over" : (avg < -0.05 ? "under" : "");
    return `<div class="hole-bar">
      <div class="v">${fmtVs(avg)}</div>
      <div class="bar ${cls}" style="height:${h}px" title="Loch ${i + 1}: Ø ${fmtVs(avg)} vs. Par"></div>
      <div>${i + 1}</div>
    </div>`;
  }).join("");

  const bd = new Date(s.bestRound.date);
  el.innerHTML = `
    <div class="card">
      <h2>📊 Statistik: ${esc(s.name)}</h2>
      ${selector}
      <div class="stat-cards">
        <div class="stat-box"><div class="val">${s.roundCount}</div><div class="lbl">Runden gespielt</div></div>
        <div class="stat-box"><div class="val">${s.lochsiege}</div><div class="lbl">Lochsiege</div></div>
        <div class="stat-box"><div class="val">${s.avgPerHole.toFixed(2).replace(".", ",")}</div><div class="lbl">Ø Schläge pro Loch</div></div>
        <div class="stat-box"><div class="val">${fmtVs(s.avgVsParPerHole)}</div><div class="lbl">Ø vs. Par pro Loch</div></div>
        <div class="stat-box"><div class="val">${s.bestRound.total}</div>
          <div class="lbl">Beste Runde (${s.bestRound.vs === 0 ? "E" : (s.bestRound.vs > 0 ? "+" : "") + s.bestRound.vs})<br>
          ${esc(s.bestRound.course)}, ${bd.toLocaleDateString("de-DE")}</div></div>
      </div>
      <div class="stat-cards">${parTypeHtml}</div>
    </div>
    <div class="card">
      <h2>Score-Verteilung (${total} Löcher)</h2>
      ${distRows}
    </div>
    <div class="card">
      <h2>Ø Abweichung vom Par je Lochnummer</h2>
      <p style="font-size:0.8rem;color:var(--muted);margin-bottom:6px">
        Grün = unter Par, Orange = über Par (gemittelt über alle Runden)</p>
      <div class="hole-bars">${holeBarsHtml}</div>
    </div>`;
}

/* ---------- Start ---------- */
render();
</script>
</body>
</html>
